<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Refaccionaria Automotriz{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'tienda:lista_refacciones' %}">🏎️ Refaccionaria Web</a>
        
        <!-- Buscador -->
        <form class="d-flex mx-auto w-50" action="{% url 'tienda:lista_refacciones' %}" method="GET">
            <input class="form-control me-2" type="search" name="q" placeholder="Buscar pieza, SKU o vehículo..." value="{{ query|default:'' }}">
            <button class="btn btn-outline-light" type="submit">Buscar</button>
        </form>

        <div class="d-flex ms-auto">
            <a href="{% url 'tienda:ver_carrito' %}" class="btn btn-warning fw-bold">
                🛒 Carrito ({{ total_items_carrito }})
            </a>
        </div>
    </div>
</nav>

    <div class="container mb-5">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
